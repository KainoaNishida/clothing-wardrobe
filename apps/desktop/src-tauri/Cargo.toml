[package]
name = "clothing-wardrobe"
version = "0.1.0"
description = "Private desktop wardrobe and outfit simulator"
authors = ["Kainoa Nishida"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "clothing_wardrobe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
